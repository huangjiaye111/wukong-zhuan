<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>造梦西游 · 悟空传（网页复刻版）</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0e16;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cv {
    background: #1a2233;
    image-rendering: auto;
    outline: none;
  }
  #boot { position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    color: #ecd9aa; background: #111d31; font: 16px/1.8 system-ui, sans-serif; z-index: 10; padding: 24px; }
  #boot[hidden] { display: none; }
  #boot strong { font-size: 30px; letter-spacing: 5px; }
  #boot button { margin: 16px auto; padding: 10px 26px; border: 1px solid #ccb477; border-radius: 8px;
    color: #f9ebc8; background: #315d59; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<div id="boot" role="status"><strong>造梦西游 · 悟空传</strong><span id="boot-message">正在准备西游之路……</span><button id="boot-retry" hidden onclick="location.reload()">重新加载</button><noscript>请启用浏览器 JavaScript 后重新打开游戏。</noscript></div>
<canvas id="cv" width="960" height="540" aria-label="悟空传游戏画面，鼠标操作菜单，A D移动，J攻击，K跳跃，Esc暂停"></canvas>
<script>
  // 独立体验入口复用同一正式游戏，全部进度和声音设置仅留在本页。
  if (new URLSearchParams(location.search).get('practice') === '1') {
    const memory = new Map();
    if (new URLSearchParams(location.search).get('silent') === '1') memory.set('zmxy_muted', '1');
    Object.defineProperty(window, 'localStorage', { configurable: true, value: {
      getItem: key => memory.get(String(key)) ?? null,
      setItem: (key, value) => memory.set(String(key), String(value)),
      removeItem: key => memory.delete(String(key)), clear: () => memory.clear(),
      key: index => Array.from(memory.keys())[index] ?? null, get length() { return memory.size; }
    } });
    document.title = '悟空传 v85 · 体验版（进度仅在本页）';
  }
  window.addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT' || event.error) {
      document.getElementById('boot').hidden = false;
      document.getElementById('boot').dataset.failed = 'true';
      document.getElementById('boot-message').textContent = '游戏未能正常启动，请重新加载。若仍失败，请确认游戏文件完整。';
      document.getElementById('boot-retry').hidden = false;
    }
  }, true);
</script>
<script src="js/utils.js?v=85"></script>
<script src="js/audio.js?v=85"></script>
<script src="js/save.js?v=85"></script>
<script src="js/balance.js?v=85"></script>
<script src="js/sprites.js?v=85"></script>
<script src="js/fx.js?v=85"></script>
<script src="js/background.js?v=85"></script>
<script src="js/entities.js?v=85"></script>
<script src="js/player.js?v=85"></script>
<script src="js/level.js?v=85"></script>
<script src="js/ui.js?v=85"></script>
<script src="js/main.js?v=85"></script>
</body>
</html>
